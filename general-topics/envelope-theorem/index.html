<body>

  <header class="site-header">
    <page-header category="General Topics" home="../../index.html"></page-header>
  </header>

  <main id="main-content" class="page-width">
    <section class="introduction" aria-labelledby="page-title">
      <h1 id="page-title">The Envelope Theorem</h1>
      <!-- Add user-authored introduction here: the general setup (an
           arbitrary choice set X, a parameter t, a jointly defined f(x,t),
           the value function V(t) = sup over x in X of f(x,t)), and a
           statement of Theorem 2 of Milgrom and Segal, "Envelope Theorems
           for Arbitrary Choice Sets" (Econometrica 70(2), 2002: 583-601):
           given f(x,.) absolutely continuous for every x with |f_t(x,t)|
           bounded by an integrable b(t) uniform in x, V is absolutely
           continuous, so V(t) = V(0) + integral_0^t f_t(x*(s),s) ds for
           any selection x*(s) of a maximizer. No mechanism-design or
           incentive-compatibility framing belongs on this page -- that
           worked example now lives in the separate, draft "Payments from
           an Allocation Rule" module. -->
    </section>

    <section class="explorable explorable-divider" aria-label="Family-of-lines interface">
      <div class="envelope-layout">
        <div class="envelope-main-column">
          <div class="chart-column">
            <div class="chart-frame">
              <svg
                id="main-chart"
                class="tradeoff-chart envelope-curve-chart"
                viewBox="0 0 660 450"
                role="img"
                tabindex="0"
                aria-labelledby="main-chart-title main-chart-description"
                aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Home End"
              >
                <title id="main-chart-title">Family of lines and their envelope V(t)</title>
                <desc id="main-chart-description">A family of straight lines, each with two points independently draggable anywhere along the plot's own edge, with their pointwise-maximum envelope V(t) searched universally and drawn in bold, dotted where it runs outside [0,1].</desc>
              </svg>
            </div>
          </div>

          <aside class="choice-controls envelope-controls" aria-label="Point controls">
            <p id="point-control-label" class="point-control-heading">Line A, point 1</p>

            <div class="range-group">
              <div class="range-label-row">
                <label id="point-t-control-label" for="point-t-number">t-axis intercept</label>
                <input
                  id="point-t-number"
                  class="range-number-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0"
                  inputmode="decimal"
                  aria-labelledby="point-t-control-label"
                >
              </div>
              <input id="point-t-slider" class="envelope-point-slider" type="range" min="0" max="1" step="0.01" value="0" aria-labelledby="point-control-label point-t-control-label">
              <div class="range-endpoints envelope-point-slider" aria-hidden="true"><span>0</span><span>1</span></div>
            </div>

            <div class="range-group">
              <div class="range-label-row">
                <label id="point-v-control-label" for="point-v-number">V(t)-axis intercept</label>
                <input
                  id="point-v-number"
                  class="range-number-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0"
                  inputmode="decimal"
                  aria-labelledby="point-v-control-label"
                >
              </div>
              <input id="point-v-slider" class="envelope-point-slider" type="range" min="0" max="1" step="0.01" value="0" aria-labelledby="point-control-label point-v-control-label">
              <div class="range-endpoints envelope-point-slider" aria-hidden="true"><span>0</span><span>1</span></div>
            </div>

            <div class="point-count-buttons">
              <button id="add-line" class="text-button" type="button">Add line</button>
              <button id="remove-line" class="text-button" type="button">Remove selected line</button>
            </div>
          </aside>
        </div>

        <div class="envelope-diagnostic-column">
          <div class="diagnostic-panel">
            <figure class="diagnostic-figure">
              <svg
                id="slope-chart"
                class="diagnostic-chart envelope-diagnostic-chart"
                viewBox="0 0 440 300"
                role="img"
                aria-labelledby="slope-chart-title slope-chart-description"
              >
                <title id="slope-chart-title">Active slope</title>
                <desc id="slope-chart-description">The active line's own slope as a step function of t, jumping at each point where the envelope's maximizing line switches; a vertical line's infinite slope is marked by a dotted vertical line, in its own color, instead of a finite step.</desc>
              </svg>
            </figure>
          </div>

          <div class="diagnostic-panel">
            <figure class="diagnostic-figure">
              <svg
                id="bound-chart"
                class="diagnostic-chart envelope-diagnostic-chart"
                viewBox="0 0 440 300"
                role="img"
                aria-labelledby="bound-chart-title bound-chart-description"
              >
                <title id="bound-chart-title">Steepest slope required</title>
                <desc id="bound-chart-description">The magnitude of each line's own slope; the tallest bar is the smallest bound that currently dominates them all. If any line is vertical, only its bar is shown, at full height, labeled infinity.</desc>
              </svg>
            </figure>
          </div>
        </div>
      </div>

      <p id="live-summary" class="sr-only" aria-live="polite"></p>
    </section>

    <section class="derivation" aria-labelledby="derivation-title">
      <h2 id="derivation-title">Theorem 2</h2>
      <!-- Add user-authored derivation here: the full statement and proof
           sketch of Theorem 2, the role of the uniform integrable bound
           b(t), and why a finite family of ordinary (finite-slope) lines
           always trivially satisfies it (V is automatically
           piecewise-linear, hence Lipschitz, hence absolutely continuous)
           even though no fixed b(t) could dominate every family reachable
           by dragging: either endpoint of a line may be dragged onto the
           plot's own top or bottom edge (not only the left/right edges),
           and dragging one point close enough to the other's own t snaps
           the line to a genuinely vertical, infinite-slope line rather
           than merely a very steep finite one. The envelope search itself
           is universal -- every finite-slope line's own affine formula is
           extended over the whole domain, not only the sub-interval the
           learner actually drew it across -- so the true V(t) can run
           outside [0,1]; the plot clamps and dots it there rather than
           rescaling, since both axes stay fixed. -->
    </section>
