  <main id="main-content" class="page-width">
    <section class="introduction" aria-labelledby="page-title">
      <h1 id="page-title">Payments from an Allocation Rule (draft)</h1>
      <!-- WORK IN PROGRESS: this module was originally built and titled
           "The Envelope Theorem," using a single-agent quasilinear
           allocation/payment (Q,P) construction as its running example. At
           the user's direction that name and slot are being freed for a
           new, more general module demonstrating Theorem 2 of Milgrom and
           Segal's "Envelope Theorems for Arbitrary Choice Sets" (2002)
           directly, without any mechanism-design/IC framing. This page's
           existing content may instead become the seed of a future revenue
           -equivalence or optimal-auction module -- not decided yet. Add
           user-authored introduction here if this module's scope firms up:
           the single-agent quasilinear environment, the allocation/payment
           rule (Q,P), and the interactive task (painting Q and reading off
           what local incentive compatibility forces onto U and P). -->
    </section>

    <section class="explorable explorable-divider" aria-label="Allocation-curve interface">
      <div class="main-diagnostic-layout">
        <div class="main-column main-column-660">
          <div class="chart-column">
            <figure class="diagnostic-figure math-chart-figure">
              <figcaption>Allocation rule, \(Q(v)\)</figcaption>
              <div class="math-chart-frame">
                <svg
                  id="curve-chart"
                  class="tradeoff-chart chart-660x450"
                  viewBox="0 0 660 450"
                  role="img"
                  tabindex="0"
                  aria-labelledby="curve-chart-title curve-chart-description"
                  aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Home End"
                >
                  <title id="curve-chart-title">Allocation rule, Q(v)</title>
                  <desc id="curve-chart-description">A smooth, shape-preserving cubic Hermite curve through up to nine draggable control points, giving the probability of allocation as a function of type v.</desc>
                </svg>
                <p class="math-chart-axis-label math-chart-x-axis-label">Type, \(v\)</p>
              </div>
            </figure>
          </div>

          <aside class="choice-controls shrink-to-fit" aria-label="Point controls">
            <div class="range-group">
              <div class="range-label-row">
                <label id="point-value-control-label" for="point-value-slider">Allocation probability at this point</label>
                <input
                  id="point-value-number"
                  class="range-number-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0"
                  inputmode="decimal"
                  aria-labelledby="point-value-control-label"
                >
              </div>
              <input id="point-value-slider" class="slider-320" type="range" min="0" max="1" step="0.01" value="0">
              <div class="range-endpoints slider-320" aria-hidden="true"><span>0</span><span>1</span></div>
            </div>

            <div class="point-count-buttons">
              <button id="add-point" class="text-button" type="button">Add point</button>
              <button id="remove-point" class="text-button" type="button">Remove selected point</button>
            </div>
          </aside>
        </div>

        <div class="diagnostic-column diagnostic-column-440">
          <div class="diagnostic-panel">
            <figure class="diagnostic-figure math-chart-figure">
              <figcaption>Information rent, \(U(v)\)</figcaption>
              <div class="math-chart-frame">
                <svg
                  id="envelope-chart"
                  class="diagnostic-chart chart-440x300"
                  viewBox="0 0 440 300"
                  role="img"
                  aria-labelledby="envelope-chart-title envelope-chart-description"
                >
                  <title id="envelope-chart-title">Envelope of deviation payoffs</title>
                  <desc id="envelope-chart-description">The rent curve U(v) shaded beneath it, together with one straight deviation-payoff line per control point; a line rising above U(v) marks a profitable deviation.</desc>
                </svg>
                <p class="math-chart-axis-label math-chart-x-axis-label">Type, \(v\)</p>
              </div>
            </figure>
          </div>

          <div class="diagnostic-panel">
            <figure class="diagnostic-figure math-chart-figure">
              <figcaption>Payment rule, \(P(v)\)</figcaption>
              <div class="math-chart-frame">
                <svg
                  id="payment-chart"
                  class="diagnostic-chart chart-440x300"
                  viewBox="0 0 440 300"
                  role="img"
                  aria-labelledby="payment-chart-title payment-chart-description"
                >
                  <title id="payment-chart-title">Payment rule</title>
                  <desc id="payment-chart-description">The payment P(v) implied by the painted allocation curve and the envelope formula.</desc>
                </svg>
                <p class="math-chart-axis-label math-chart-x-axis-label">Type, \(v\)</p>
              </div>
            </figure>
          </div>
        </div>
      </div>

      <p id="live-summary" class="sr-only" aria-live="polite"></p>
    </section>

    <section class="derivation" aria-labelledby="derivation-title">
